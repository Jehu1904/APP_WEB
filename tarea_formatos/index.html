<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>Registro de Estudiantes</h1>
            <p>Formulario con validaciones (RegEx) y almacenamiento local en JSON</p>
        </header>

        <!-- Formulario de registro -->
        <section class="tarjeta">
            <h2>Datos del estudiante</h2>
            <form id="formulario-estudiante">
                <div class="rejilla">
                    <div class="campo">
                        <label for="cedula">Cédula:</label>
                        <input type="text" id="cedula" placeholder="Ej. 1312345678">
                        <span class="error" id="error-cedula"></span>
                    </div>

                    <div class="campo">
                        <label for="apellidos">Apellidos:</label>
                        <input type="text" id="apellidos" placeholder="Ej. Pérez Mendoza">
                        <span class="error" id="error-apellidos"></span>
                    </div>

                    <div class="campo">
                        <label for="nombres">Nombres:</label>
                        <input type="text" id="nombres" placeholder="Ej. Juan Carlos">
                        <span class="error" id="error-nombres"></span>
                    </div>

                    <div class="campo">
                        <label for="direccion">Dirección:</label>
                        <input type="text" id="direccion" placeholder="Ej. Av. 24 y Calle 15, Manta">
                        <span class="error" id="error-direccion"></span>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" placeholder="Ej. 0991234567">
                        <span class="error" id="error-telefono"></span>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo electrónico:</label>
                        <input type="text" id="correo" placeholder="usuario@correo.com">
                        <span class="error" id="error-correo"></span>
                    </div>

                    <div class="campo">
                        <label for="facultad">Facultad:</label>
                        <input type="text" id="facultad" placeholder="Ej. Ciencias Informáticas">
                        <span class="error" id="error-facultad"></span>
                    </div>

                    <div class="campo">
                        <label for="nivel">Nivel:</label>
                        <select id="nivel">
                            <option value="">Seleccione...</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                        <span class="error" id="error-nivel"></span>
                    </div>

                    <div class="campo">
                        <label for="paralelo">Paralelo:</label>
                        <select id="paralelo">
                            <option value="">Seleccione...</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                        </select>
                        <span class="error" id="error-paralelo"></span>
                    </div>
                </div>

                <button type="submit">Guardar estudiante</button>
            </form>
        </section>

        <!-- Listado: la tabla se llena desde JavaScript con los datos de localStorage -->
        <section class="tarjeta">
            <h2>Estudiantes registrados</h2>
            <div class="tabla-responsiva">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Apellidos</th>
                            <th>Nombres</th>
                            <th>Dirección</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Facultad</th>
                            <th>Nivel</th>
                            <th>Paralelo</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
